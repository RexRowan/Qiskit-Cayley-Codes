name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint dependencies
        run: pip install black ruff

      - name: Check formatting (black)
        run: black --check qiskit_cayley_codes tests

      - name: Lint (ruff)
        run: ruff check qiskit_cayley_codes tests
