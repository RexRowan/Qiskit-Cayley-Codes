[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qiskit-cayley-codes"
version = "0.1.1"
description = "CSS quantum code construction from Cayley graphs over zero-sumfree sets"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "Rex Rowan" }
]
requires-python = ">=3.10"
dependencies = [
    "qiskit>=2.0,<3",
    "numpy>=1.24",
    "networkx>=3.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]
keywords = ["qiskit", "quantum computing", "quantum error correction", "CSS codes", "Cayley graphs"]

[project.urls]
Homepage = "https://github.com/RexRowan/qiskit-cayley-codes"
Repository = "https://github.com/RexRowan/qiskit-cayley-codes"
Issues = "https://github.com/RexRowan/qiskit-cayley-codes/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "black",
    "ruff",
]

[tool.setuptools.packages.find]
include = ["qiskit_cayley_codes*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
